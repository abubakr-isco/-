{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Блог{% endblock %} · Блог</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="{% static 'blog/style.css' %}" rel="stylesheet">
</head>
<body>
  <header class="navbar navbar-expand-sm navbar-dark bg-dark">
    <nav class="container d-flex flex-wrap align-items-center gap-3" aria-label="Главное меню">
      <a class="navbar-brand me-auto" href="{% url 'article_list' %}">Блог</a>
      <a class="nav-link text-white" href="{% url 'article_list' %}">Статьи</a>
      <a class="nav-link text-white" href="{% url 'article_create' %}">Новая статья</a>
      <a class="nav-link text-white" href="{% url 'feedback' %}">Обратная связь</a>
    </nav>
  </header>

  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 mt-5 text-center text-muted">
    <div class="container">Учебный блог · Django</div>
  </footer>
</body>
</html>
