{% extends "blog/base.html" %}

{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<article>
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
    <div>
      <h1>{{ article.title }}</h1>
      <p class="text-muted">{{ article.created_at|date:"d.m.Y" }} · {{ article.category }}</p>
    </div>
    <a class="btn btn-outline-primary" href="{% url 'article_edit' article.pk %}">Редактировать</a>
  </div>
  <div class="article-text">{{ article.text|linebreaks }}</div>
</article>
<a href="{% url 'article_list' %}">← Все статьи</a>
{% endblock %}
